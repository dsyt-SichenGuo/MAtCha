# Generated-only reconstruction. All images have RGB weight 1; no dense DAV2 depth prior.
seed: 42
model:
  sh_degree: 3
  resolution: 1
  data_device: cuda
  white_background: false
pipeline:
  depth_ratio: 0.5
optimization:
  iterations: 30000
  densify_from_iter: 500
  densify_until_iter: 15000
  densification_interval: 100
  densify_grad_threshold: 0.0003
  opacity_reset_interval: 3000
  lambda_dssim: 0.2
  lambda_normal: 0.05
  lambda_dist: 0.0
chart_every: 20
generated_rgb_weight: 1.0
normal_consistency_from: 7000
distortion_from: 3000
use_mip_filter: true
save_iterations:
- 7000
- 15000
- 30000
checkpoint_iterations:
- 5000
- 10000
- 15000
- 20000
- 25000
- 30000
